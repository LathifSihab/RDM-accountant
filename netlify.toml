# Netlify. Deploy: publish directory = site/

[build]
  publish = "site"


# ---------------------------------------------------------------------------
# STAGING GUARD - remove the X-Robots-Tag line below at launch.
# While the site carries invented tariffs and placeholder facts it must not be
# indexable. tools/preflight.py blocks the launch if this line is still here
# once every content blocker is cleared, so it cannot be forgotten.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self' 'sha256-dNdlBplWR5bDZDI+YCKolkPPL27/gS/a7SNuPT2Lg0A='; connect-src 'self'; frame-src https://www.openstreetmap.org; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

# Fingerprint-free filenames, so HTML must revalidate but assets can be cached.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Extensionless URLs work, but .html is canonical — one form, no loops.
[[redirects]]
  from = "/diensten"
  to = "/diensten.html"
  status = 301
[[redirects]]
  from = "/tarief"
  to = "/tarief.html"
  status = 301
[[redirects]]
  from = "/over-ons"
  to = "/over-ons.html"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
[[redirects]]
  from = "/privacybeleid"
  to = "/privacybeleid.html"
  status = 301
[[redirects]]
  from = "/cookiebeleid"
  to = "/cookiebeleid.html"
  status = 301
[[redirects]]
  from = "/algemene-voorwaarden"
  to = "/algemene-voorwaarden.html"
  status = 301
[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer.html"
  status = 301
